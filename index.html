<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.ico" />
        <title>New Year's Eve Countdown</title>
        <meta name="description" content="A New Year countdown clock" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Rozha+One&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app"></div>
        <script type="module">
            import { mount } from "svelte";
            import App from "./App.svelte";

            mount(App, {
                target: document.getElementById("app"),
            });
        </script>

        <noscript>
            <p id="noscript">Please enable JavaScript</p>

            <style>
            #app {
                display: none;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                position: relative;
            }
            #noscript {
                font-size: 3rem;
            }
            </style>
        </noscript>
    </body>
</html>
